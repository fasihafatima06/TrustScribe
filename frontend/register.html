<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - TrustScribe</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div class="card" style="width: 100%; max-width: 440px;">
    <div style="text-align:center; margin-bottom: 24px;">
      <h2 style="font-weight:700;">Get Started with TrustScribe</h2>
      <p style="color:#94A3B8; font-size:0.85rem;">Create your secure researcher workspace</p>
    </div>

    <div id="regError" style="display:none; background:#FEE2E2; color:#EF4444; padding:10px; border-radius:6px; font-size:0.85rem; margin-bottom:16px;"></div>

    <form id="regForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" class="input-field" placeholder="Dr. Ananya Sharma" required />
      </div>
      <div class="form-group">
        <label for="companyName">Organization / Institution</label>
        <input type="text" id="companyName" class="input-field" placeholder="IIT Bombay / Independent" />
      </div>
      <div class="form-group">
        <label for="email">Work Email</label>
        <input type="email" id="email" class="input-field" placeholder="ananya@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password (minimum 8 characters)</label>
        <input type="password" id="password" class="input-field" placeholder="••••••••" minlength="8" required />
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Create Free Account</button>
    </form>

    <p style="font-size:0.85rem; color:#94A3B8; text-align:center; margin-top: 20px;">
      Already registered? <a href="login.html" style="color:var(--primary); text-decoration:none;">Log in</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("regError");
      errBox.style.display = "none";
      try {
        const res = await api.request("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            full_name: document.getElementById("fullName").value,
            company_name: document.getElementById("companyName").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        api.setAuth(res.access_token, res.user);
        window.location.href = "dashboard.html";
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
