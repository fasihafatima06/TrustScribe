<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects Dashboard - TrustScribe</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="dashboard.html" class="logo-group">
      <span>TrustScribe</span>
      <span class="logo-badge">Dashboard</span>
    </a>
    <div style="display:flex; align-items:center; gap: 16px;">
      <span id="userProfileEmail" style="color:#94A3B8; font-size:0.85rem;"></span>
      <button id="logoutBtn" class="btn-outline" style="padding: 6px 12px; font-size: 0.8rem;">Log out</button>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h2 style="font-weight:700;">Research Projects</h2>
        <p style="color:#94A3B8; font-size:0.9rem;">Organize interviews, field recordings, and acoustic audits</p>
      </div>
      <div style="display:flex; gap:10px;"><button id="exploreWorkspace" class="btn-outline">Explore a workspace</button><button id="openNewProjectModal" class="btn-primary">+ New Project</button></div>
    </div>

    <!-- Projects Grid (Sketch 5) -->
    <div id="projectsContainer" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
      <p style="color:#94A3B8;">Loading projects...</p>
    </div>
  </div>

  <!-- Create Project Modal Dialog -->
  <dialog id="newProjModal" style="margin: auto; border: 1px solid var(--bg-subtle); border-radius: 12px; background: var(--bg-surface); padding: 24px; color: #fff; width: 440px;">
    <h3 style="margin-bottom: 16px;">Create New Project</h3>
    <form id="newProjForm">
      <div class="form-group">
        <label for="projName">Project Name</label>
        <input type="text" id="projName" class="input-field" placeholder="e.g. Rural Fintech Pilot - Nashik" required />
      </div>
      <div class="form-group">
        <label for="projDesc">Description (Optional)</label>
        <input type="text" id="projDesc" class="input-field" placeholder="Field interviews regarding payment failures" />
      </div>
      <div style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button type="button" class="btn-outline" onclick="document.getElementById('newProjModal').close()">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
